<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CleanTab</title>
  <!-- The pause page replaces the blocked tab, so without this the tab keeps a
       generic globe icon and reads as a broken page rather than a deliberate one. -->
  <link rel="icon" type="image/png" sizes="16x16" href="../Assets/icon16.png"/>
  <link rel="icon" type="image/png" sizes="48x48" href="../Assets/icon48.png"/>
  <link rel="icon" type="image/png" sizes="128x128" href="../Assets/icon128.png"/>
  <link rel="stylesheet" href="../Assets/fonts/fonts.css"/>
  <link rel="stylesheet" href="redirect.css"/>
</head>
<body>

  <!-- Breathing overlay -->
  <div class="breath-overlay" id="breathOverlay">
    <div class="breath-orb" id="breathOrb"></div>
    <p class="breath-word" id="breathWord">Breathe in</p>
    <button class="breath-skip" id="breathSkip">Skip</button>
  </div>

  <div class="page">

    <nav class="topbar">
      <div class="wordmark"><span class="wm-accent">Clean</span>Tab</div>
    </nav>

    <main class="main">
      <div class="copy">
        <h1 class="pause">Pause.</h1>
        <p class="reason" id="reason-text">This page was flagged.</p>
      </div>

      <div class="rule"></div>

      <div class="reflect">
        <!-- First-time note (shown once) -->
        <p class="first-note" id="firstTimeNote" style="display:none">
          Pick what fits — only you ever see this.
        </p>

        <p class="reflect-q">What's actually going on right now?</p>

        <div class="chips" id="chips">
          <button class="chip" data-chip="bored">Bored</button>
          <button class="chip" data-chip="stressed">Stressed</button>
          <button class="chip" data-chip="habit">Habit</button>
          <button class="chip" data-chip="avoiding">Avoiding something</button>
          <button class="chip" data-chip="lonely">Lonely</button>
          <button class="chip" data-chip="tired">Tired</button>
        </div>

        <div class="logged" id="chipLogged" style="display:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
          <span id="loggedText">Logged.</span>
        </div>

        <div class="nudge-card" id="nudgeCard" style="display:none">
          <p class="nudge-text" id="nudgeText"></p>
          <button class="nudge-breathe" id="nudgeBreathe" style="display:none">Take a beat →</button>
        </div>
      </div>

      <div class="rule"></div>

      <div class="secondary">
        <button class="sec-btn" id="breatheBtn">Take a beat</button>
        <span class="sec-sep">·</span>
        <button class="sec-btn" id="wrongBtn">This was wrongly flagged</button>
      </div>

      <!-- Escape hatches. Revealed only after "wrongly flagged", so the default path
           stays the pause rather than the way around it. -->
      <div class="escape" id="escapeBox" style="display:none">
        <button class="escape-btn" id="allowOnceBtn">
          <span class="escape-title">Let me through once</span>
          <span class="escape-sub" id="allowOnceSub">This page only, 10 minutes. Nothing saved.</span>
        </button>
        <button class="escape-btn" id="trustSiteBtn">
          <span class="escape-title">This site is fine</span>
          <span class="escape-sub" id="trustSiteSub">Check its images and trust it from now on.</span>
        </button>
      </div>

      <div class="appeal-result" id="appeal-status"></div>

    </main>
  </div>

  <script src="../shared/dates.js"></script>
  <script src="../shared/domains.js"></script>
  <script src="../shared/allowance.js"></script>
  <script src="../shared/thresholds.js"></script>
  <script src="../shared/schema.js"></script>
  <script src="../shared/migrations/v0_to_v1.js"></script>
  <script src="../shared/migrations/v1_to_v2.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="redirect.js"></script>
</body>
</html>
